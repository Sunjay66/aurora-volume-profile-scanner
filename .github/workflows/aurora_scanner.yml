name: Aurora Volume Profile Scanner

on:
  schedule:
    - cron: "0 11 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  scan:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: Run Aurora Volume Profile Scanner
        run: |
          echo "=========================================="
          echo "AURORA VOLUME PROFILE SCANNER"
          echo "GITHUB ACTION RUN"
          echo "=========================================="

          python scanner.py

      - name: Verify scanner output
        run: |
          echo "=========================================="
          echo "VERIFYING SCANNER OUTPUT"
          echo "=========================================="

          echo ""
          echo "Output directory:"
          ls -lah output/

          test -f output/aurora_volume_profile_candidates.csv
          test -f output/aurora_five_profiles.csv
          test -f output/scan_summary.json

      - name: Publish latest scanner results
        run: |
          cp output/aurora_volume_profile_candidates.csv \
             aurora_candidates.csv

          cp output/aurora_five_profiles.csv \
             aurora_five_profiles.csv

          cp output/scan_summary.json \
             scan_summary.json

      - name: Display final candidates
        run: |
          echo "=========================================="
          echo "FINAL AURORA CANDIDATES"
          echo "=========================================="

          cat aurora_candidates.csv

      - name: Commit updated scanner results
        run: |
          git config user.name \
            "Aurora Volume Profile Scanner"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            aurora_candidates.csv \
            aurora_five_profiles.csv \
            scan_summary.json

          git diff --cached --quiet || \
            git commit -m \
            "Update Aurora Volume Profile scan"

          git push
